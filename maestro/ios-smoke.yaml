# 练衡 iOS 冒烟流程：用文字点击走遍五个 tab 与两个 modal。
#
# 为什么不走 deep link：iOS 18+ 从外部用自定义 scheme 打开 App 会弹
# “Open in 练衡?” 系统确认框，而这个弹窗属于 SpringBoard，simctl 无法
# 编程关闭、坐标点击在 CI 里也不可靠。直接点 UI 上的文字最稳，顺便
# 这才是真正的端到端交互测试。
appId: app.liheng.mobile
---
- launchApp:
    clearState: false
- assertVisible: "今天的账本"
- takeScreenshot: shots/01-today

- tapOn: "训练"
- takeScreenshot: shots/02-train

- tapOn: "饮食"
- takeScreenshot: shots/03-food

- tapOn: "身体"
- takeScreenshot: shots/04-health

- tapOn: "我的"
- takeScreenshot: shots/05-me

- tapOn: "今日"
- takeScreenshot: shots/06-today-again

# modal 一：拍照识别（未配置 Key 时应显示配置引导而不是崩溃）
# 按钮文案是 “📷 拍一餐”，用正则匹配更稳。
- tapOn:
    text: ".*拍一餐"
- takeScreenshot: shots/07-capture
- tapOn: "关闭"

# modal 二：每日配餐
- tapOn: "明天吃什么"
- takeScreenshot: shots/08-plan
- tapOn: "关闭"

- takeScreenshot: shots/09-final
