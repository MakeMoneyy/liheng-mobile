name: Diag dismiss alert

# 一次性诊断：复用已构建好的 .app（从 run 38504907444 下载），
# 快速试出哪种方式能关掉 iOS 18+ 的 “Open in 练衡?” 确认框。
# 探完即删。

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Download previously built .app artifact
        uses: actions/download-artifact@v4
        with:
          name: liheng-ios-simulator
          run-id: 38504907444
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack app
        run: |
          set -euo pipefail
          ls -la
          unzip -q liheng-ios-simulator.zip -d appdir
          APP_PATH=$(find appdir -maxdepth 2 -name "*.app" -type d | head -n 1)
          echo "APP_PATH=${APP_PATH}"
          echo "APP_PATH=${APP_PATH}" >> "$GITHUB_ENV"

      - name: Boot, install, and try dismiss strategies
        run: |
          set -euo pipefail

          echo "=== java on runner ==="
          java -version 2>&1 | head -n 3 || echo "NO JAVA"

          echo "=== install maestro ==="
          set +e
          curl -Ls "https://get.maestro.mobile.dev" -o /tmp/maestro_install.sh
          echo "install script curl exit=$? size=$(wc -c < /tmp/maestro_install.sh 2>/dev/null)"
          head -n 20 /tmp/maestro_install.sh 2>/dev/null
          bash /tmp/maestro_install.sh
          echo "installer exit=$?"
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro --version 2>&1 | head -n 5
          echo "maestro exit=$?"
          set -e

          DEVICE_ID=$(xcrun simctl list devices available | grep -m 1 -E "iPhone" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "device: ${DEVICE_ID}"
          xcrun simctl boot "${DEVICE_ID}" || true
          xcrun simctl bootstatus "${DEVICE_ID}" -b
          xcrun simctl install "${DEVICE_ID}" "${APP_PATH}"

          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool true || true
          open -a Simulator || true
          sleep 10

          mkdir -p shots
          snap() { xcrun simctl io "${DEVICE_ID}" screenshot "shots/$1.png"; }

          xcrun simctl launch "${DEVICE_ID}" app.liheng.mobile
          sleep 12
          snap "00-launched"

          # 触发自定义 scheme 的确认框
          xcrun simctl openurl "${DEVICE_ID}" "liheng:///train" || true
          sleep 3
          snap "01-alert"

          echo "=== dump UI tree + click + return + space ==="
          osascript scripts/dismiss-open-alert.applescript dump 2>&1 || true
          osascript scripts/dismiss-open-alert.applescript click 2>&1 || true
          sleep 3
          snap "02-after-click"
          osascript scripts/dismiss-open-alert.applescript return 2>&1 || true
          sleep 3
          snap "03-after-return"
          osascript scripts/dismiss-open-alert.applescript space 2>&1 || true
          sleep 3
          snap "04-after-space"

          # 弹窗若已关掉，这次 openurl 应能真正跳到「训练」
          xcrun simctl openurl "${DEVICE_ID}" "liheng:///food" || true
          sleep 3
          snap "05-after-nav"

          echo "=== hashes ==="
          (md5 shots/*.png || md5sum shots/*.png) | sed 's#shots/##'

      - name: Upload diag shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-shots
          path: shots/*.png
          if-no-files-found: warn
