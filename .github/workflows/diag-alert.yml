name: Diag dismiss alert

# 一次性诊断：复用已构建好的 .app（从 run 38504907444 下载），
# 快速试出哪种方式能关掉 iOS 18+ 的 “Open in 练衡?” 确认框。
# 探完即删。

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Download previously built .app artifact
        uses: actions/download-artifact@v4
        with:
          name: liheng-ios-simulator
          run-id: 38504907444
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack app
        run: |
          set -euo pipefail
          ls -la
          unzip -q liheng-ios-simulator.zip -d appdir
          APP_PATH=$(find appdir -maxdepth 2 -name "*.app" -type d | head -n 1)
          echo "APP_PATH=${APP_PATH}"
          echo "APP_PATH=${APP_PATH}" >> "$GITHUB_ENV"

      - name: Boot, install, and try dismiss strategies
        run: |
          set -euo pipefail

          echo "=== install maestro ==="
          curl -Ls "https://get.maestro.mobile.dev" | bash
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro --version

          DEVICE_ID=$(xcrun simctl list devices available | grep -m 1 -E "iPhone" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "device: ${DEVICE_ID}"
          xcrun simctl boot "${DEVICE_ID}" || true
          xcrun simctl bootstatus "${DEVICE_ID}" -b
          xcrun simctl install "${DEVICE_ID}" "${APP_PATH}"

          # Maestro 用文字点击导航，完全避开 deep link 确认框。
          export MAESTRO_CLI_NO_ANALYTICS=1
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=180000
          maestro test maestro/ios-smoke.yaml \
            --device "${DEVICE_ID}" \
            --format junit \
            --output maestro-report.xml || true

          echo "=== screenshots produced by Maestro ==="
          (ls -la shots/ 2>/dev/null || echo "no shots dir")
          (md5 shots/*.png || md5sum shots/*.png) 2>/dev/null | sed 's#shots/##' || true

      - name: Upload diag shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-shots
          path: |
            shots/*.png
            maestro-report.xml
          if-no-files-found: warn
