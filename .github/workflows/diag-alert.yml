name: Diag dismiss alert

# 一次性诊断：复用已构建好的 .app（从 run 38504907444 下载），
# 快速试出哪种方式能关掉 iOS 18+ 的 “Open in 练衡?” 确认框。
# 探完即删。

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout repo (for maestro flow + scripts)
        uses: actions/checkout@v4

      - name: Download previously built .app artifact
        uses: actions/download-artifact@v4
        with:
          name: liheng-ios-simulator
          run-id: 38504907444
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # 放到 runner 临时目录，别落在工作区里——这个 artifact 自带
          # screenshots/*.png，落在工作区会被后面的 find 收进来污染结果。
          path: ${{ runner.temp }}/appartifact

      - name: Unpack app
        run: |
          set -euo pipefail
          ls -la "${RUNNER_TEMP}/appartifact"
          unzip -q "${RUNNER_TEMP}/appartifact/liheng-ios-simulator.zip" -d "${RUNNER_TEMP}/appdir"
          APP_PATH=$(find "${RUNNER_TEMP}/appdir" -maxdepth 2 -name "*.app" -type d | head -n 1)
          echo "APP_PATH=${APP_PATH}"
          echo "APP_PATH=${APP_PATH}" >> "$GITHUB_ENV"

      - name: Boot, install, and try dismiss strategies
        run: |
          set -euo pipefail

          echo "=== install maestro ==="
          curl -Ls "https://get.maestro.mobile.dev" | bash
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro --version

          DEVICE_ID=$(xcrun simctl list devices available | grep -m 1 -E "iPhone" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "device: ${DEVICE_ID}"
          xcrun simctl boot "${DEVICE_ID}" || true
          xcrun simctl bootstatus "${DEVICE_ID}" -b
          xcrun simctl install "${DEVICE_ID}" "${APP_PATH}"
          xcrun simctl launch "${DEVICE_ID}" app.liheng.mobile || true
          sleep 20

          # Maestro 用文字点击导航，完全避开 deep link 确认框。
          export MAESTRO_CLI_NO_ANALYTICS=1
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=180000

          # 先 dump 一次层级树，方便确认 tab 元素的实际文本/坐标。
          maestro hierarchy > hierarchy.txt 2>&1 || true
          echo "=== hierarchy (first 120 lines) ==="
          head -n 120 hierarchy.txt || true

          maestro test maestro/ios-smoke.yaml \
            --device "${DEVICE_ID}" \
            --format junit \
            --output maestro-report.xml || true

          echo "=== screenshots produced by Maestro ==="
          mkdir -p shots
          # 兜底：无论流程成败，都留一张流程结束时的设备状态。
          xcrun simctl io "${DEVICE_ID}" screenshot shots/99-after-flow.png || true
          # Maestro 把 takeScreenshot 的输出放到
          #   $HOME/.maestro/tests/<时间戳>/<flow 名>/takeScreenshot/shots/
          # 而不是 flow 文件的相对路径下，所以显式去那里取。
          MAESTRO_SHOTS=$(find "$HOME/.maestro/tests" -type d -path "*takeScreenshot/shots" 2>/dev/null | sort | tail -n 1 || true)
          echo "maestro shots dir: ${MAESTRO_SHOTS:-<none>}"
          if [ -n "${MAESTRO_SHOTS}" ]; then
            cp "${MAESTRO_SHOTS}"/*.png shots/ || true
          fi
          (ls -la shots/ || true)
          (md5 shots/*.png || md5sum shots/*.png) 2>/dev/null | sed 's#.*/##' || true

      - name: Upload diag shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-shots
          path: |
            shots/*.png
            maestro-report.xml
          if-no-files-found: warn
