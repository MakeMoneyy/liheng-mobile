name: Android Emulator

# 在 GitHub 托管的 ubuntu runner 上真跑一次 Android 模拟器：
# prebuild -> gradle assembleRelease -> 装进 KVM 加速的模拟器 ->
# 用与 iOS **完全相同** 的 maestro/smoke.yaml 走一遍主流程 -> 截图回传。
# 公开仓库的托管 runner 免费，本机因此不必再下 2–3 GB 的 NDK/CMake。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "assets/**"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - "babel.config.js"
      - "tsconfig.json"
      - "maestro/**"
      - "scripts/**"
      - "tools/**"
      - ".github/workflows/android-simulator.yml"

concurrency:
  group: android-simulator-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: "1"
  APP_ID: app.liheng.mobile

jobs:
  android-emulator:
    name: Build and run on Android Emulator
    runs-on: ubuntu-latest
    # 冷启动实测：Gradle（4 个 ABI 的 C++ 编译）20-27 分钟 + 模拟器启动 8-16 分钟
    # + 装包与 Maestro 若干分钟，60 分钟会被掐掉（踩过一次 cancelled）。
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          # Release 把 JS bundle 内联进 APK，模拟器里没有 Metro 也能独立跑，
          # 与 iOS 那条链路的 Release 选择保持一致。
          #
          # 只编 x86_64：模拟器就是 x86_64，编另外三个 ABI 纯属浪费 ——
          # 四个 ABI 时 APK 134 MB、光 adb install 就 7 分半，C++ 编译占掉 20 多分钟。
          ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures=x86_64

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Run app on emulator and capture evidence
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          # action 默认只给 AVD 2 核；runner 有 4 核，给满能明显加快装包与冷启动
          cores: 4
          ram-size: 4096
          # 这台 runner 上冷启动实测要 16 分钟，默认 900 秒太贴边了
          emulator-boot-timeout: 1500
          script: |
            # 这里只能是一行：android-emulator-runner 把 script 逐行交给
            # `sh -c`（dash）执行，变量与 if/while 都不跨行。逻辑放在脚本文件里。
            bash scripts/android-evidence.sh

      - name: Upload emulator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liheng-android-emulator
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            screenshots/*.png
            maestro-report.xml
          if-no-files-found: warn
          retention-days: 30
